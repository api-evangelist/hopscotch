name: Hopscotch
description: Hopscotch Primary Care is a value-based healthcare provider bringing relationship-based
  primary care to rural communities, with a focus on seniors on Medicare and Medicare/Medicaid plans.
  Operating clinics across Western North Carolina and beyond, Hopscotch pairs longer appointments and
  multidisciplinary care teams with same-day access and help navigating insurance. Backed by 8VC, CVS
  Health Ventures, K2 HealthVentures, Town Hall Ventures and others, it is a patient-facing care company
  with no public developer API surface; patient records are handled through an athenahealth portal.
